<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gaming Oracle: The Maximum Undetectable Lie">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0F0E0B"/>
      <stop offset="1" stop-color="#14131a"/>
    </linearGradient>
    <linearGradient id="line" x1="720" y1="0" x2="1140" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1B3DFF"/>
      <stop offset="1" stop-color="#00B870"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="360" fill="url(#bg)"/>

  <!-- faint grid -->
  <g stroke="#F4F1E8" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
  </g>
  <!-- quant-blue side rule -->
  <rect x="60" y="96" width="4" height="168" rx="2" fill="#1B3DFF"/>

  <!-- LEFT: title block -->
  <text x="88" y="112" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14" letter-spacing="4" fill="#00B870" font-weight="600">OPEN SOURCE · MIT · REPRODUCIBLE</text>
  <text x="86" y="184" font-family="'Fraunces', Georgia, 'Times New Roman', serif" font-size="72" fill="#F4F1E8" font-weight="700">Gaming Oracle</text>
  <text x="88" y="228" font-family="'Fraunces', Georgia, serif" font-size="27" fill="#1B3DFF" font-weight="600" font-style="italic">The Maximum Undetectable Lie</text>
  <text x="88" y="272" font-family="'Geist', -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="16" fill="#F4F1E8" fill-opacity="0.62">How far a VaR / ES backtest panel can be gamed, and what e-backtesting leaves behind.</text>

  <!-- RIGHT: e-process motif (naive attacker crosses the reject threshold) -->
  <g transform="translate(760,60)">
    <!-- axes -->
    <line x1="0" y1="240" x2="360" y2="240" stroke="#F4F1E8" stroke-opacity="0.25" stroke-width="1.5"/>
    <line x1="0" y1="20" x2="0" y2="240" stroke="#F4F1E8" stroke-opacity="0.25" stroke-width="1.5"/>
    <!-- reject threshold -->
    <line x1="0" y1="86" x2="360" y2="86" stroke="#FF4D4D" stroke-width="2" stroke-dasharray="7 6"/>
    <text x="360" y="80" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="12" fill="#FF4D4D">reject = 20</text>
    <!-- e-aware attacker: stays under (survives) -->
    <path d="M0 236 L60 232 L120 226 L180 220 L240 214 L300 206 L360 198" stroke="#1B3DFF" stroke-opacity="0.55" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="360" y="192" text-anchor="end" font-family="'JetBrains Mono', monospace" font-size="11" fill="#1B3DFF" fill-opacity="0.8">e-aware · survives</text>
    <!-- naive attacker: spikes and is caught -->
    <path d="M0 236 L55 232 L110 224 L150 210 L185 150 L210 96 L235 52 L270 30 L320 22 L360 20" stroke="#00B870" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="210" cy="96" r="6" fill="#00B870"/>
    <circle cx="210" cy="96" r="11" fill="none" stroke="#00B870" stroke-opacity="0.4" stroke-width="2"/>
    <text x="130" y="40" font-family="'JetBrains Mono', monospace" font-size="12" fill="#00B870" font-weight="600">naive · caught</text>
    <text x="8" y="256" font-family="'JetBrains Mono', monospace" font-size="10" fill="#F4F1E8" fill-opacity="0.4">trading day within window</text>
  </g>
</svg>
